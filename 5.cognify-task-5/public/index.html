<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cognifyz Task 5 - API Integration</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f8;
        }


        header {
            background: #007bff;

            color: white;

            text-align: center;

            padding: 25px;
        }


        .container {
            width: 90%;

            max-width: 900px;

            margin: 40px auto;
        }


        .card {
            background: white;

            padding: 25px;

            margin-bottom: 25px;

            border-radius: 10px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.1);
        }


        h2 {
            margin-top: 0;
        }


        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 15px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 16px;
        }


        button {
            padding: 10px 18px;

            border: none;

            border-radius: 5px;

            background: #007bff;

            color: white;

            font-size: 15px;

            cursor: pointer;

            margin-right: 8px;
        }


        button:hover {
            background: #0056b3;
        }


        .cancel-btn {
            background: #6c757d;
        }


        .cancel-btn:hover {
            background: #545b62;
        }


        .delete-btn {
            background: #dc3545;
        }


        .delete-btn:hover {
            background: #a71d2a;
        }


        .user {
            padding: 18px;

            margin-bottom: 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            background: #fafafa;
        }


        .user-buttons {
            margin-top: 15px;
        }


        .message {
            margin-top: 15px;

            font-weight: bold;
        }


        #editSection {
            display: none;
        }

    </style>

</head>


<body>


    <header>

        <h1>
            Cognifyz Technologies
        </h1>

        <p>
            Task 5 - API Integration
        </p>

    </header>


    <div class="container">


        <!-- =====================================
             CREATE USER
        ====================================== -->

        <div class="card">

            <h2>
                Create New User
            </h2>


            <input
                type="text"
                id="name"
                placeholder="Enter name">


            <input
                type="email"
                id="email"
                placeholder="Enter email">


            <button
                onclick="createUser()">

                Add User

            </button>


            <div
                id="message"
                class="message">
            </div>

        </div>



        <!-- =====================================
             EDIT USER
        ====================================== -->

        <div
            class="card"
            id="editSection">

            <h2>
                Edit User
            </h2>


            <input
                type="hidden"
                id="editId">


            <input
                type="text"
                id="editName"
                placeholder="Enter updated name">


            <input
                type="email"
                id="editEmail"
                placeholder="Enter updated email">


            <button
                onclick="updateUser()">

                Update User

            </button>


            <button
                class="cancel-btn"
                onclick="cancelEdit()">

                Cancel

            </button>


            <div
                id="editMessage"
                class="message">
            </div>

        </div>



        <!-- =====================================
             DISPLAY USERS
        ====================================== -->

        <div class="card">

            <h2>
                Users
            </h2>


            <div id="usersList">

                Loading users...

            </div>

        </div>

    </div>



    <script>


        // ==========================================
        // GET USERS
        // ==========================================

        async function getUsers() {

            try {

                const response =
                    await fetch("/api/users");


                const users =
                    await response.json();


                const usersList =
                    document.getElementById(
                        "usersList"
                    );


                usersList.innerHTML = "";


                if (users.length === 0) {

                    usersList.innerHTML =
                        "<p>No users available.</p>";

                    return;

                }


                users.forEach(function (user) {

                    const userDiv =
                        document.createElement(
                            "div"
                        );


                    userDiv.className = "user";


                    userDiv.innerHTML = `

                        <strong>
                            ID:
                        </strong>
                        ${user.id}

                        <br><br>

                        <strong>
                            Name:
                        </strong>
                        ${user.name}

                        <br><br>

                        <strong>
                            Email:
                        </strong>
                        ${user.email}

                        <div class="user-buttons">

                            <button
                                onclick="startEdit(
                                    ${user.id},
                                    '${user.name}',
                                    '${user.email}'
                                )">

                                Edit

                            </button>


                            <button
                                class="delete-btn"
                                onclick="deleteUser(
                                    ${user.id}
                                )">

                                Delete

                            </button>

                        </div>

                    `;


                    usersList.appendChild(
                        userDiv
                    );

                });

            }

            catch (error) {

                console.error(error);

                document.getElementById(
                    "usersList"
                ).textContent =
                    "Unable to load users.";

            }

        }



        // ==========================================
        // CREATE USER
        // ==========================================

        async function createUser() {

            const name =
                document.getElementById(
                    "name"
                ).value.trim();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const message =
                document.getElementById(
                    "message"
                );


            if (!name || !email) {

                message.textContent =
                    "Please enter name and email.";

                return;

            }


            try {

                const response =
                    await fetch(
                        "/api/users",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                name: name,

                                email: email

                            })

                        }
                    );


                const data =
                    await response.json();


                message.textContent =
                    data.message;


                if (response.ok) {

                    document.getElementById(
                        "name"
                    ).value = "";


                    document.getElementById(
                        "email"
                    ).value = "";


                    getUsers();

                }

            }

            catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to connect to server.";

            }

        }



        // ==========================================
        // START EDIT
        // ==========================================

        function startEdit(id, name, email) {

            document.getElementById(
                "editSection"
            ).style.display = "block";


            document.getElementById(
                "editId"
            ).value = id;


            document.getElementById(
                "editName"
            ).value = name;


            document.getElementById(
                "editEmail"
            ).value = email;


            document.getElementById(
                "editMessage"
            ).textContent = "";


            document.getElementById(
                "editSection"
            ).scrollIntoView({

                behavior: "smooth"

            });

        }



        // ==========================================
        // UPDATE USER
        // ==========================================

        async function updateUser() {

            const id =
                document.getElementById(
                    "editId"
                ).value;


            const name =
                document.getElementById(
                    "editName"
                ).value.trim();


            const email =
                document.getElementById(
                    "editEmail"
                ).value.trim();


            const message =
                document.getElementById(
                    "editMessage"
                );


            if (!name || !email) {

                message.textContent =
                    "Please enter name and email.";

                return;

            }


            try {

                const response =
                    await fetch(
                        `/api/users/${id}`,
                        {

                            method: "PUT",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                name: name,

                                email: email

                            })

                        }
                    );


                const data =
                    await response.json();


                message.textContent =
                    data.message;


                if (response.ok) {

                    getUsers();

                    setTimeout(function () {

                        cancelEdit();

                    }, 1000);

                }

            }

            catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to update user.";

            }

        }



        // ==========================================
        // CANCEL EDIT
        // ==========================================

        function cancelEdit() {

            document.getElementById(
                "editSection"
            ).style.display = "none";


            document.getElementById(
                "editId"
            ).value = "";


            document.getElementById(
                "editName"
            ).value = "";


            document.getElementById(
                "editEmail"
            ).value = "";

        }



        // ==========================================
        // DELETE USER
        // ==========================================

        async function deleteUser(id) {

            const confirmation =
                confirm(
                    "Are you sure you want to delete this user?"
                );


            if (!confirmation) {

                return;

            }


            try {

                const response =
                    await fetch(
                        `/api/users/${id}`,
                        {

                            method: "DELETE"

                        }
                    );


                const data =
                    await response.json();


                alert(data.message);


                if (response.ok) {

                    getUsers();

                }

            }

            catch (error) {

                console.error(error);

                alert(
                    "Unable to delete user."
                );

            }

        }



        // ==========================================
        // LOAD USERS WHEN PAGE OPENS
        // ==========================================

        getUsers();

    </script>


</body>

</html>
